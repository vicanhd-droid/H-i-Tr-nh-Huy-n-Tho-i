name: Build Android APK from ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract ZIP and Build
      run: |
        if [ -f "game-v1.5-server-files.zip" ]; then
          unzip -q game-v1.5-server-files.zip -d extracted_game
        fi
        
        # Tìm xem trong thư mục giải nén có file build nào không, nếu có gradlew thì chạy build
        find . -name "gradlew" -exec chmod +x {} \;
        
        # Thử build ở thư mục gốc hoặc thư mục con tìm được
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug
        elif [ -f "./extracted_game/gradlew" ]; then
          cd extracted_game && ./gradlew assembleDebug
        fi

    - name: Upload Any APK Found
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          **/build/outputs/apk/debug/*.apk
        if-no-files-found: warn
        
