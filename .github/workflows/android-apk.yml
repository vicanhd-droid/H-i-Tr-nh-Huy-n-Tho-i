name: Build Direct APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Compile and Package APK Manually
      run: |
        mkdir -p build_apk/assets build_apk/gen build_apk/obj build_apk/apk_out
        
        # Giải nén game vào assets
        if [ -f "game-v1.5-server-files.zip" ]; then
          unzip -q game-v1.5-server-files.zip -d build_apk/assets
        fi

        # Tạo AndroidManifest.xml
        cat << 'EOF' > build_apk/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.example.game"
            android:versionCode="1"
            android:versionName="1.0">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:label="Hải Trình Huyền Thoại" android:usesCleartextTraffic="true">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # Tạo MainActivity.java
        cat << 'EOF' > build_apk/MainActivity.java
        package com.example.game;
        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                WebView webView = new WebView(this);
                webView.getSettings().setJavaScriptEnabled(true);
                webView.getSettings().setDomStorageEnabled(true);
                webView.setWebViewClient(new WebViewClient());
                webView.loadUrl("file:///android_asset/index.html");
                setContentView(webView);
            }
        }
        EOF

        cd build_apk
        
        # Biên dịch Java sang DEX
        javac -source 1.7 -target 1.7 -bootclasspath $ANDROID_HOME/platforms/android-33/android.jar MainActivity.java -d obj/
        $ANDROID_HOME/build-tools/33.0.2/dx --dex --output=classes.dex obj/

        # Đóng gói tài nguyên và assets bằng aapt
        $ANDROID_HOME/build-tools/33.0.2/aapt package -f -M AndroidManifest.xml -A assets -I $ANDROID_HOME/platforms/android-33/android.jar -F unsigned.apk
        
        # Thêm file classes.dex vào APK
        $ANDROID_HOME/build-tools/33.0.2/aapt add unsigned.apk classes.dex

        # Ký APK để cài đặt được trên điện thoại
        jarsigner -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey unsigned.apk androiddebugkey || true
        
        # Nếu jarsigner chưa có keystore, tạo mới:
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug, O=Android, C=US" 2>/dev/null || true
        jarsigner -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey unsigned.apk androiddebugkey
        
        cp unsigned.apk final-game.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: build_apk/final-game.apk
        
