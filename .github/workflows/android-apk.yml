name: Build WebView APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Download & Build Ready-made WebView Template
      run: |
        # Tải sẵn một template WebView chuẩn Android từ kho mã nguồn mở
        git clone https://github.com/escapee/Simple-Android-WebView.git temp_project
        
        # Giải nén game của bạn vào thư mục assets của template
        if [ -f "game-v1.5-server-files.zip" ]; then
          unzip -q game-v1.5-server-files.zip -d web_files
          rm -rf temp_project/app/src/main/assets/*
          cp -r web_files/* temp_project/app/src/main/assets/ || cp -r * temp_project/app/src/main/assets/ 2>/dev/null || true
        fi

        cd temp_project
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: temp_project/app/build/outputs/apk/debug/app-debug.apk
        
